aid: theta-edge
name: Theta EdgeCloud
description: >-
  Theta EdgeCloud is a distributed, hybrid AI and video cloud built on the
  Theta Network blockchain, offering on-demand GPU compute for AI model
  training, fine-tuning, inference, video transcoding, and live streaming.
  EdgeCloud aggregates GPU capacity from data-center hyperscaler partners
  and a global community of Edge Nodes (consumer and enterprise GPUs) into
  a single dispatchable compute layer addressable via REST, JSON-RPC, and
  SDK clients. Core services include EdgeCloud AI Services (on-demand
  model inference APIs for LLMs, image, audio, and multimodal models such
  as Llama, Stable Diffusion, FLUX, and Whisper; agentic RAG chatbots;
  GPU-backed Jupyter notebooks; dedicated GPU pod deployments; and AI
  training with GPU clusters), EdgeCloud Video Services (the Theta Video
  API for upload, transcoding, livestream ingestion, DRM, NFT-gated
  playback, and webhooks), EdgeStore (decentralized object storage), and
  the EdgeCloud Client (an installable node that earns TFUEL for
  contributing GPU and bandwidth). Developers authenticate with
  x-api-key tokens issued from the EdgeCloud dashboard, manage
  deployments programmatically through api.thetaedgecloud.com and the
  Node.js SDK @thetalabs/theta-edgecloud, and access on-demand model
  endpoints (also distributed through RapidAPI). The Theta blockchain
  layer is EVM-compatible with an Ethereum RPC adaptor, supports TNT-20
  tokens and NFTs, and underwrites EdgeCloud's payment, rewards, and
  staking economy through the THETA governance token and TFUEL gas
  token. Theta operates as Theta Labs, headquartered in San Jose,
  California.
